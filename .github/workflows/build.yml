name: Build & Release CloudInit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, artifact: CloudInit-linux-x64,       go: '1.23.x' }
          - { goos: linux,   goarch: arm64, artifact: CloudInit-linux-a64,       go: '1.23.x' }
          - { goos: darwin,  goarch: arm64, artifact: CloudInit-macos-a64,       go: '1.23.x' }
          - { goos: darwin,  goarch: amd64, artifact: CloudInit-macos-x64,       go: '1.23.x' }
          - { goos: windows, goarch: amd64, artifact: CloudInit-win10-x64.exe,   go: '1.23.x' }
          - { goos: windows, goarch: '386', artifact: CloudInit-win10-x86.exe,   go: '1.23.x' }
          - { goos: windows, goarch: arm64, artifact: CloudInit-win10-a64.exe,   go: '1.23.x' }
          # Win7/Win8.1 需使用 Go 1.20（Go 1.21+ 不再支持旧版 Windows）
          - { goos: windows, goarch: amd64, artifact: CloudInit-win78-x64.exe,   go: '1.20.x' }
          - { goos: windows, goarch: '386', artifact: CloudInit-win78-x86.exe,   go: '1.20.x' }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
        cache: true

    - name: Build
      env:
        CGO_ENABLED: '0'
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p dist-artifact
        go build -trimpath -ldflags="-s -w" -o dist-artifact/${{ matrix.artifact }} .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: dist-artifact/
        retention-days: 30

  # Push 自动发布到 beta release
  release-beta:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Display structure of downloaded files
      run: ls -R artifacts

    - name: Create/Update beta tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -fa beta -m "Beta build from ${{ github.sha }}"
        git push origin beta --force

    - name: Create/Update Beta Release
      uses: softprops/action-gh-release@v1
      with:
        fail_on_unmatched_files: false
        files: |
          artifacts/CloudInit-win10-x64.exe
          artifacts/CloudInit-win10-x86.exe
          artifacts/CloudInit-win10-a64.exe
          artifacts/CloudInit-win78-x64.exe
          artifacts/CloudInit-win78-x86.exe
          artifacts/CloudInit-linux-x64
          artifacts/CloudInit-linux-a64
          artifacts/CloudInit-macos-x64
          artifacts/CloudInit-macos-a64
        tag_name: beta
        name: Beta Build (Latest)
        body: |
          🚧 **自动构建的 Beta 版本**

          提交: ${{ github.sha }}
          分支: ${{ github.ref_name }}
          时间: ${{ github.event.head_commit.timestamp }}

          > 此版本随每次 push 自动更新，仅供测试使用。
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 手动触发发布正式版本
  release-stable:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Display structure of downloaded files
      run: ls -R artifacts

    - name: Create version tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -fa ${{ github.event.inputs.version }} -m "Release ${{ github.event.inputs.version }}"
        git push origin ${{ github.event.inputs.version }} --force

    - name: Create Stable Release
      uses: softprops/action-gh-release@v1
      with:
        fail_on_unmatched_files: false
        files: |
          artifacts/CloudInit-win10-x64.exe
          artifacts/CloudInit-win10-x86.exe
          artifacts/CloudInit-win10-a64.exe
          artifacts/CloudInit-win78-x64.exe
          artifacts/CloudInit-win78-x86.exe
          artifacts/CloudInit-linux-x64
          artifacts/CloudInit-linux-a64
          artifacts/CloudInit-macos-x64
          artifacts/CloudInit-macos-a64
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
