name: Build & Release CloudInits

# 注意：发布资产文件名不可变更（如 CloudInit-win78-x64.exe）。
# 老版本客户端（含 Python 版本）的自动更新依赖文件名中的“系统标识 + 架构”进行匹配，
# 改名会导致存量虚拟机无法升级。win78 必须使用 Go 1.20 编译（Go 1.21+ 不支持 Win7/8.1）。

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, artifact: CloudInit-linux-x64,       go: '1.23.x' }
          - { goos: linux,   goarch: arm64, artifact: CloudInit-linux-a64,       go: '1.23.x' }
          - { goos: darwin,  goarch: arm64, artifact: CloudInit-macos-a64,       go: '1.23.x' }
          - { goos: darwin,  goarch: amd64, artifact: CloudInit-macos-x64,       go: '1.23.x' }
          - { goos: windows, goarch: amd64, artifact: CloudInit-win10-x64.exe,   go: '1.23.x' }
          - { goos: windows, goarch: '386', artifact: CloudInit-win10-x86.exe,   go: '1.23.x' }
          - { goos: windows, goarch: arm64, artifact: CloudInit-win10-a64.exe,   go: '1.23.x' }
          # Win7/Win8.1 需使用 Go 1.20（Go 1.21+ 不再支持旧版 Windows）
          - { goos: windows, goarch: amd64, artifact: CloudInit-win78-x64.exe,   go: '1.20.x' }
          - { goos: windows, goarch: '386', artifact: CloudInit-win78-x86.exe,   go: '1.20.x' }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
        cache: true

    - name: Build
      env:
        CGO_ENABLED: '0'
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p dist-artifact
        go build -trimpath -ldflags="-s -w" -o dist-artifact/${{ matrix.artifact }} .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: dist-artifact/
        retention-days: 30

  # 脚本语法检查（安装脚本出错会直接影响线上部署）
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check shell scripts
      run: |
        sh -n scripts/install.sh
        sh -n scripts/sync_edgeone.sh

    - name: Check PowerShell script
      shell: pwsh
      run: |
        $errors = $null
        [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errors)
        if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  # 打包工具（MASAIO.cmd / ToDeskSunDump.exe），版本取自 tool/tools.json
  tools:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Package tools
      run: |
        mkdir -p dist-tools
        python3 - <<'PY'
        import hashlib
        import json
        import os
        import shutil

        spec = json.load(open("tool/tools.json", encoding="utf-8"))
        entries = []
        for tool in spec.get("tools", []):
            name = tool["name"]
            version = tool["version"]
            source = os.path.join("tool", tool.get("file", name))
            base, ext = os.path.splitext(name)
            asset = f"CloudInit-tool-{base}-{version}{ext}"

            data = open(source, "rb").read()
            # 批处理必须 CRLF 且末尾有换行，否则 MAS 自检会直接退出
            if name.lower().endswith((".cmd", ".bat")):
                data = data.replace(b"\r\n", b"\n").replace(b"\r", b"\n").replace(b"\n", b"\r\n")
                if not data.endswith(b"\r\n"):
                    data += b"\r\n"

            with open(os.path.join("dist-tools", asset), "wb") as handle:
                handle.write(data)

            digest = hashlib.sha256(data).hexdigest()
            entries.append({
                "name": name,
                "version": version,
                "asset": asset,
                "sha256": digest,
            })
            print(f"{name} {version} -> {asset}")

        with open("dist-tools/CloudInit-tools.json", "w", encoding="utf-8") as handle:
            json.dump({"tools": entries}, handle, ensure_ascii=False, indent=2)
        PY

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CloudInit-tools
        path: dist-tools/
        retention-days: 30

  # Push 自动发布到 beta release
  release-beta:
    needs: [ build, tools, lint ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Display structure of downloaded files
      run: ls -R artifacts

    - name: Add install scripts
      run: |
        cp scripts/install.sh artifacts/install.sh
        cp scripts/install.ps1 artifacts/install.ps1

    - name: Create/Update beta tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -fa beta -m "Beta build from ${{ github.sha }}"
        git push origin beta --force

    - name: Create/Update Beta Release
      uses: softprops/action-gh-release@v1
      with:
        fail_on_unmatched_files: false
        files: |
          artifacts/CloudInit-win10-x64.exe
          artifacts/CloudInit-win10-x86.exe
          artifacts/CloudInit-win10-a64.exe
          artifacts/CloudInit-win78-x64.exe
          artifacts/CloudInit-win78-x86.exe
          artifacts/CloudInit-linux-x64
          artifacts/CloudInit-linux-a64
          artifacts/CloudInit-macos-x64
          artifacts/CloudInit-macos-a64
          artifacts/CloudInit-tools.json
          artifacts/CloudInit-tool-*.exe
          artifacts/CloudInit-tool-*.cmd
          artifacts/install.sh
          artifacts/install.ps1
        tag_name: beta
        name: Beta Build (Latest)
        body: |
          🚧 **自动构建的 Beta 版本**

          提交: ${{ github.sha }}
          分支: ${{ github.ref_name }}
          时间: ${{ github.event.head_commit.timestamp }}

          > 此版本随每次 push 自动更新，仅供测试使用。
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 手动触发发布正式版本
  release-stable:
    needs: [ build, tools, lint ]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Display structure of downloaded files
      run: ls -R artifacts

    - name: Add install scripts
      run: |
        cp scripts/install.sh artifacts/install.sh
        cp scripts/install.ps1 artifacts/install.ps1

    - name: Create version tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -fa ${{ github.event.inputs.version }} -m "Release ${{ github.event.inputs.version }}"
        git push origin ${{ github.event.inputs.version }} --force

    - name: Create Stable Release
      uses: softprops/action-gh-release@v1
      with:
        fail_on_unmatched_files: false
        files: |
          artifacts/CloudInit-win10-x64.exe
          artifacts/CloudInit-win10-x86.exe
          artifacts/CloudInit-win10-a64.exe
          artifacts/CloudInit-win78-x64.exe
          artifacts/CloudInit-win78-x86.exe
          artifacts/CloudInit-linux-x64
          artifacts/CloudInit-linux-a64
          artifacts/CloudInit-macos-x64
          artifacts/CloudInit-macos-a64
          artifacts/CloudInit-tools.json
          artifacts/CloudInit-tool-*.exe
          artifacts/CloudInit-tool-*.cmd
          artifacts/install.sh
          artifacts/install.ps1
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 正式版本同步到 EdgeOne 镜像站（eo-idc.pika.net.cn）
  sync-edgeone:
    needs: [ build, tools, lint ]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Check EdgeOne token
      env:
        EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      run: |
        if [ -z "$EDGEONE_API_TOKEN" ]; then
          echo "::error::缺少 EDGEONE_API_TOKEN，无法同步到 EdgeOne"
          exit 1
        fi

    - name: Install EdgeOne CLI
      run: npm install -g edgeone

    - name: Prepare and deploy EdgeOne site
      env:
        EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || 'cloudinit' }}
        EDGEONE_PREFIX: ${{ vars.EDGEONE_PREFIX || 'cloudinit' }}
      run: |
        cp scripts/install.sh scripts/install.ps1 artifacts/
        chmod +x scripts/sync_edgeone.sh
        ./scripts/sync_edgeone.sh artifacts "${{ github.event.inputs.version }}" eo-site
